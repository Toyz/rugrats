[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rugrats-psx = { path = "crates/rugrats-psx" }
rugrats-data = { path = "crates/rugrats-data" }
# The shared runtime for the ports: the disc, the window and loop, the pad,
# wgpu, audio, pictures. Data crates take only the features they use.
rrt = { git = "https://github.com/Toyz/retro_rt", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

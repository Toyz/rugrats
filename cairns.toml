spec_version = 1

[project]
name        = "rugrats"
slug        = "rugrats"
description = "Reverse engineering Rugrats: Search for Reptar for the PlayStation (n-Space / THQ, 1998, SLUS-00650) and porting it natively to the PC on retro_rt, using tools written for the job in Rust. No game data included."

[site]
readme = "README.md"

[docs]
dir   = "docs"
label = "Reference"

[index]
header = """
# Worklog

Running engineering log for reverse engineering Rugrats: Search for Reptar
(PlayStation, SLUS-00650) and porting it to the PC. One file per entry under
[`worklog/`](worklog/), newest at the bottom. This index is generated by
`cairns index` - edit the entries, not this file.

Code says what; the worklog says *how we found out* and *why it is that way*.
The [reference](docs/README.md) says what is true now.
"""

[[area]]
name  = "disc"
about = "the CD image, its tracks, the ISO 9660 file system, SYSTEM.CNF and boot"
[[area]]
name  = "format"
about = "a container or record layout decoded"
[[area]]
name  = "decomp"
about = "facts pulled out of the executable"
[[area]]
name  = "engine"
about = "game loop, databases, events, memory and file loading"
[[area]]
name  = "render"
about = "GPU and GTE pipeline, models, textures, rooms"
[[area]]
name  = "play"
about = "the babies' controls, objects, NPCs, collision, episodes and activities"
[[area]]
name  = "audio"
about = "SPU, sound effects, VAB banks, SEP sequences, XA music and speech"
[[area]]
name  = "video"
about = "STR movies, BS stills and the MDEC"
[[area]]
name  = "ui"
about = "menus, HUD, fonts, text, hints"
[[area]]
name  = "input"
about = "the pad, the analog stick, vibration, the PC controller mapping"
[[area]]
name  = "save"
about = "memory card data and passwords"
[[area]]
name  = "content"
about = "what is on the disc, inventories, counts, cut content"
[[area]]
name  = "design"
about = "a decision made, with the alternatives rejected"
[[area]]
name  = "bug"
about = "a fault diagnosed, with the root cause"
[[area]]
name  = "tooling"
about = "the extractors, disassemblers and viewers in rugrats-re"
[[area]]
name  = "build"
about = "repository layout and how things are run"
[[area]]
name  = "test"

spec_version = 1

[project]
name        = "rugrats"
slug        = "rugrats"
repository  = "https://github.com/Toyz/rugrats"
description = "Reverse engineering Rugrats: Search for Reptar for the PlayStation (n-Space / THQ, 1998, SLUS-00650) and porting it natively to the PC on retro_rt, using tools written for the job in Rust. No game data included."

[site]
base_url = "https://toyz.github.io/rugrats/"
readme = "README.md"

[docs]
dir   = "docs"
label = "Reference"

[[link]]
label = "GitHub"
icon  = "github"
url   = "https://github.com/Toyz/rugrats"

[[link]]
label = "GitHub Issues"
icon  = "github"
url   = "https://github.com/Toyz/rugrats/issues"

[[link]]
label = "The Rust port"
icon  = "code"
url   = "https://github.com/Toyz/rugrats/tree/main/crates"

[[link]]
label = "retro_rt"
icon  = "link"
url   = "https://github.com/Toyz/retro_rt"

# Rugrats, loosely: the title burst's lavender and the green of its outline
# (Reptar's), with the logo's orange for code. Accents only; the page stays a
# neutral grey for long reads.
[colors.dark]
paper         = "#151419"
paper-sunk    = "#1d1c23"
ink           = "#ecebf0"
ink-soft      = "#bcbac7"
ink-faint     = "#85839a"
rule          = "#2e2c37"
rule-faint    = "#23222a"
link          = "#b9a8ff"
accent        = "#7ac943"
code-bg       = "#1b1a21"
mark          = "#2f4a1e"
code-keyword  = "#ff7a59"
code-string   = "#9bdc5f"
code-comment  = "#807e90"
code-number   = "#ffb84d"
code-function = "#d9c6ff"
code-type     = "#7ec8ff"

[colors.light]
paper         = "#f7f6fa"
paper-sunk    = "#edebf3"
ink           = "#1c1b20"
ink-soft      = "#47455a"
ink-faint     = "#7a788c"
rule          = "#dad7e4"
rule-faint    = "#e7e5ee"
link          = "#5a3fc0"
accent        = "#3f8f1a"
code-bg       = "#efedf5"
mark          = "#dff3c8"
code-keyword  = "#c2410c"
code-string   = "#3f7f12"
code-comment  = "#87859a"
code-number   = "#b45309"
code-function = "#6d3fc0"
code-type     = "#0b6aa8"

[index]
header = """
# Worklog

Running engineering log for reverse engineering Rugrats: Search for Reptar
(PlayStation, SLUS-00650) and porting it to the PC. One file per entry under
[`worklog/`](worklog/), newest at the bottom. This index is generated by
`cairns index` - edit the entries, not this file.

Code says what; the worklog says *how we found out* and *why it is that way*.
The [reference](docs/README.md) says what is true now.
"""

[[area]]
name  = "disc"
about = "the CD image, its tracks, the ISO 9660 file system, SYSTEM.CNF and boot"
[[area]]
name  = "format"
about = "a container or record layout decoded"
[[area]]
name  = "decomp"
about = "facts pulled out of the executable"
[[area]]
name  = "engine"
about = "game loop, databases, events, memory and file loading"
[[area]]
name  = "render"
about = "GPU and GTE pipeline, models, textures, rooms"
[[area]]
name  = "play"
about = "the babies' controls, objects, NPCs, collision, episodes and activities"
[[area]]
name  = "audio"
about = "SPU, sound effects, VAB banks, SEP sequences, XA music and speech"
[[area]]
name  = "video"
about = "STR movies, BS stills and the MDEC"
[[area]]
name  = "ui"
about = "menus, HUD, fonts, text, hints"
[[area]]
name  = "input"
about = "the pad, the analog stick, vibration, the PC controller mapping"
[[area]]
name  = "save"
about = "memory card data and passwords"
[[area]]
name  = "content"
about = "what is on the disc, inventories, counts, cut content"
[[area]]
name  = "design"
about = "a decision made, with the alternatives rejected"
[[area]]
name  = "bug"
about = "a fault diagnosed, with the root cause"
[[area]]
name  = "tooling"
about = "the extractors, disassemblers and viewers in rugrats-re"
[[area]]
name  = "build"
about = "repository layout and how things are run"
[[area]]
name  = "test"
about = "harnesses and fixtures"
